name: run

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install --with-deps

              - name: Debug pipeline
        run: |
          echo "commit:"
          git rev-parse HEAD
          echo "pipeline head:"
          sed -n '1,20p' src/pipeline.ts
          echo "dotenv search:"
          grep -R "dotenv" -n src || true
          echo "package dotenv:"
          grep -R '"dotenv"' -n package.json package-lock.json || true

      - name: Run scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: npx tsx src/pipeline.ts